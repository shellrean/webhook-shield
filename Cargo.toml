[package]
name = "webhook-shield"
version = "0.1.0"
edition = "2024"
description = "Resilient async webhook dispatcher and HMAC-SHA256 verifier with replay protection and exponential backoff"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/shellrean/webhook-shield"
homepage = "https://github.com/shellrean/webhook-shield"
documentation = "https://docs.rs/webhook-shield"
keywords = ["webhook", "hmac", "async", "resilience", "retry"]
categories = ["web-programming::http-client", "cryptography", "asynchronous"]

[dependencies]
hex = "0.4"
hmac = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.40", features = ["time", "macros", "rt"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
